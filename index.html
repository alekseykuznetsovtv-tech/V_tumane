<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Автоквест: Туман войны & Аномалии</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #121214; color: #fff; }
    #auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
    #map-container { display: none; height: 100vh; width: 100vw; position: relative; }
    #map { height: 100%; width: 100%; }
    
    .hud {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 8px;
      border: 1px solid #333; font-weight: bold; font-size: 16px;
    }
    .speed-hud {
      position: absolute; top: 60px; right: 10px; z-index: 1000;
      background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 8px;
      font-size: 14px;
    }
    input, button { padding: 12px; margin: 8px 0; width: 100%; max-width: 300px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; }
    button { background: #ffb703; color: #000; font-weight: bold; cursor: pointer; border: none; }
    .alert-box { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: #e63946; padding: 10px 20px; border-radius: 8px; display: none; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Экран авторизации -->
  <div id="auth-screen">
    <h2>Вход в Туман</h2>
    <input type="text" id="team-input" placeholder="Название команды">
    <input type="password" id="pin-input" placeholder="ПИН-код">
    <button onclick="login()">Войти в игру</button>
    <div id="auth-msg" style="color: #e63946; margin-top: 10px;"></div>
  </div>

  <!-- Игровой экран с картой -->
  <div id="map-container">
    <div class="hud" id="score-display">Очки: 500</div>
    <div class="speed-hud" id="speed-display">Скорость: 0 км/ч</div>
    <div id="map"></div>
    <div id="alert-box" class="alert-box">ВНИМАНИЕ: Превышение скорости в болоте! (-20 очков)</div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXYJVK1KSvFc0GAj_0XI-_LMXz4hhtIhGN9wCRXhkuCroFW9cKzC4sY9UzUeSzwKEacA/exec"; 

    let teamName = localStorage.getItem("q_team") || "";
    let teamPin = localStorage.getItem("q_pin") || "";
    let map, playerMarker;
    let currentLat = 67.5033, currentLng = 64.0495; // Координаты по умолчанию (Воркута)
    let zones = [];
    let visitedZones = [];
    let watchId = null;
    let inSwamp = false;
    let lastSpeedCheck = 0;

    window.onload = function() {
      if (teamName && teamPin) {
        verifyAndStart();
      }
    };

    function login() {
      teamName = document.getElementById("team-input").value.trim();
      teamPin = document.getElementById("pin-input").value.trim();
      if (!teamName || !pinInput) return;
      verifyAndStart();
    }

    function verifyAndStart() {
      fetch(`${SCRIPT_URL}?action=checkAuth&team=${encodeURIComponent(teamName)}&pin=${encodeURIComponent(teamPin)}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === "OK") {
            localStorage.setItem("q_team", teamName);
            localStorage.setItem("q_pin", teamPin);
            document.getElementById("auth-screen").style.display = "none";
            document.getElementById("map-container").style.display = "block";
            initMap();
          } else {
            document.getElementById("auth-msg").textContent = data.message;
          }
        });
    }

    function initMap() {
      // Инициализация карты (центр на Воркуту)
      map = L.map('map').setView([currentLat, currentLng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      playerMarker = L.marker([currentLat, currentLng]).addTo(map).bindPopup("Ваш экипаж");

      // Запуск GPS трекинга
      if ("geolocation" in navigator) {
        watchId = navigator.geolocation.watchPosition(onPositionUpdate, err => console.log(err), {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 5000
        });
      }

      // Синхронизация с сервером каждые 8 секунд
      setInterval(syncGameState, 8000);
      syncGameState();
    }

    function onPositionUpdate(pos) {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      let speedMs = pos.coords.speed !== null ? pos.coords.speed : 0;
      let speedKmH = Math.round(speedMs * 3.6);

      document.getElementById("speed-display").textContent = `Скорость: ${speedKmH} км/ч`;
      playerMarker.setLatLng([currentLat, currentLng]);
      map.panTo([currentLat, currentLng]);

      // Проверка зон на карте
      checkZonesProximity(currentLat, currentLng, speedKmH);
    }

    function syncGameState() {
      fetch(`${SCRIPT_URL}?action=sync&team=${encodeURIComponent(teamName)}&pin=${encodeURIComponent(teamPin)}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === "OK") {
            document.getElementById("score-display").textContent = `Очки: ${data.score}`;
            visitedZones = data.visitedZones || [];
            zones = data.zones || [];
            renderZonesOnMap();
          }
        });
    }

    function renderZonesOnMap() {
      // Очищаем старые маркеры зон (упрощенно перерисовываем)
      map.eachLayer(layer => {
        if (layer instanceof L.Circle) map.removeLayer(layer);
      });

      zones.forEach(zone => {
        if (visitedZones.includes(zone.id)) return; // Пропускаем уже пройденные

        let color = zone.type === 'anomaly' ? '#9b5de5' : '#00b4d8'; // Фиолетовый для аномалий, голубой для болит
        let fillColor = zone.type === 'anomaly' ? '#f15bb5' : '#90e0ef';

        let circle = L.circle([zone.lat, zone.lng], {
          color: color,
          fillColor: fillColor,
          fillOpacity: 0.4,
          radius: zone.radius
        }).addTo(map);

        circle.bindPopup(`<b>Сектор: ${zone.id}</b><br>Тип: ${zone.type === 'anomaly' ? '🔮 Аномалия (Бонус или Дух)' : '🌧️ Болото (Лимит 20 км/ч)'}`);
      });
    }

    function checkZonesProximity(lat, lng, speed) {
      zones.forEach(zone => {
        if (visitedZones.includes(zone.id)) return;

        let dist = map.distance([lat, lng], [zone.lat, zone.lng]);

        // Если машина въехала в радиус зоны
        if (dist <= zone.radius) {
          if (zone.type === 'swamp' && speed > 20) {
            // Штраф за превышение в болоте
            showAlert("Штраф! Скорость в болоте выше 20 км/ч!");
            triggerZoneAction(zone.id);
          } else if (zone.type === 'anomaly') {
            // Заход в аномалию (команда сама решает, рискнуть ли)
            triggerZoneAction(zone.id);
          }
        }
      });
    }

    function triggerZoneAction(zoneId) {
      fetch(`${SCRIPT_URL}?action=enterZone&team=${encodeURIComponent(teamName)}&pin=${encodeURIComponent(teamPin)}&zoneId=${zoneId}&coords=${currentLat},${currentLng}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === "OK") {
            alert(data.message);
            syncGameState();
          }
        });
    }

    function showAlert(text) {
      let box = document.getElementById("alert-box");
      box.textContent = text;
      box.style.display = "block";
      setTimeout(() => box.style.display = "none", 4000);
    }
  </script>
</body>
</html>
